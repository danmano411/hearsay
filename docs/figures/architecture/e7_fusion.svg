<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" width="900" height="740" font-family="Segoe UI, Helvetica, Arial, sans-serif"><style>.t{font-size:20px;font-weight:700;fill:#1b2430}.s{font-size:13px;fill:#5d6975}.bt{font-size:14px;font-weight:600}.bl{font-size:12px}.al{font-size:11.5px;fill:#5d6975;font-style:italic}.k{font-size:11px;fill:#5d6975}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6975"/></marker></defs><rect width="900" height="740" fill="#ffffff"/><text x="24" y="34" class="t">E7 · fusion of R4ft, R6, R7a and R1 (final submission)</text><text x="24" y="56" class="s">Three XLS-R models (one trained with RawBoost channel noise) plus the classic model; Stage 11 rule.</text><rect x="40.0" y="76" width="196" height="80" rx="8" fill="#dff1ef" stroke="#0c6b6b" stroke-width="1.6"/><text x="52.0" y="97" class="bt" fill="#1b2430">R4ft: XLS-R</text><text x="52.0" y="116" class="bl" fill="#3a4652">seed 0, original data</text><text x="52.0" y="132" class="bl" fill="#3a4652">logit, higher = fake</text><rect x="40.0" y="186" width="196" height="62" rx="8" fill="#e3edf8" stroke="#3d6fa3" stroke-width="1.6"/><text x="52.0" y="207" class="bt" fill="#1b2430">transform</text><text x="52.0" y="226" class="bl" fill="#3a4652">margin: as-is</text><rect x="40.0" y="278" width="196" height="62" rx="8" fill="#e3edf8" stroke="#3d6fa3" stroke-width="1.6"/><text x="52.0" y="299" class="bt" fill="#1b2430">standardize</text><text x="52.0" y="318" class="bl" fill="#3a4652">z = (x − μ) / σ</text><path d="M138.0,156 L138.0,184" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M138.0,248 L138.0,276" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><rect x="248.0" y="76" width="196" height="80" rx="8" fill="#dff1ef" stroke="#0c6b6b" stroke-width="1.6"/><text x="260.0" y="97" class="bt" fill="#1b2430">R6: XLS-R</text><text x="260.0" y="116" class="bl" fill="#3a4652">seed 1, + 6,155 clips</text><text x="260.0" y="132" class="bl" fill="#3a4652">logit, higher = fake</text><rect x="248.0" y="186" width="196" height="62" rx="8" fill="#e3edf8" stroke="#3d6fa3" stroke-width="1.6"/><text x="260.0" y="207" class="bt" fill="#1b2430">transform</text><text x="260.0" y="226" class="bl" fill="#3a4652">margin: as-is</text><rect x="248.0" y="278" width="196" height="62" rx="8" fill="#e3edf8" stroke="#3d6fa3" stroke-width="1.6"/><text x="260.0" y="299" class="bt" fill="#1b2430">standardize</text><text x="260.0" y="318" class="bl" fill="#3a4652">z = (x − μ) / σ</text><path d="M346.0,156 L346.0,184" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M346.0,248 L346.0,276" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><rect x="456.0" y="76" width="196" height="80" rx="8" fill="#dff1ef" stroke="#0c6b6b" stroke-width="1.6"/><text x="468.0" y="97" class="bt" fill="#1b2430">R7a: XLS-R + RawBoost</text><text x="468.0" y="116" class="bl" fill="#3a4652">seed 2, RawBoost 60 %</text><text x="468.0" y="132" class="bl" fill="#3a4652">best step 10,240</text><rect x="456.0" y="186" width="196" height="62" rx="8" fill="#e3edf8" stroke="#3d6fa3" stroke-width="1.6"/><text x="468.0" y="207" class="bt" fill="#1b2430">transform</text><text x="468.0" y="226" class="bl" fill="#3a4652">margin: as-is</text><rect x="456.0" y="278" width="196" height="62" rx="8" fill="#e3edf8" stroke="#3d6fa3" stroke-width="1.6"/><text x="468.0" y="299" class="bt" fill="#1b2430">standardize</text><text x="468.0" y="318" class="bl" fill="#3a4652">z = (x − μ) / σ</text><path d="M554.0,156 L554.0,184" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M554.0,248 L554.0,276" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><rect x="664.0" y="76" width="196" height="80" rx="8" fill="#dff1ef" stroke="#0c6b6b" stroke-width="1.6"/><t