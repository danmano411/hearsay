<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1010" width="900" height="1010" font-family="Segoe UI, Helvetica, Arial, sans-serif"><style>.t{font-size:20px;font-weight:700;fill:#1b2430}.s{font-size:13px;fill:#5d6975}.bt{font-size:14px;font-weight:600}.bl{font-size:12px}.al{font-size:11.5px;fill:#5d6975;font-style:italic}.k{font-size:11px;fill:#5d6975}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6975"/></marker></defs><rect width="900" height="1010" fill="#ffffff"/><text x="24" y="34" class="t">R4ft · XLS-R-300M, fine-tuned end to end (the core model)</text><text x="24" y="56" class="s">A self-supervised speech network pretrained on 436k hours in 128 languages, cut to 12 of 24 blocks. Headline 0.0282.</text><rect x="230" y="76" width="440" height="46" rx="8" fill="#eef1f4" stroke="#6b7784" stroke-width="1.6"/><text x="242" y="97" class="bt" fill="#1b2430">Audio clip, 16 kHz mono</text><rect x="230" y="146" width="440" height="76" rx="8" fill="#e3edf8" stroke="#3d6fa3" stroke-width="1.6"/><text x="242" y="167" class="bt" fill="#1b2430">prep()  (every clip, train and test)</text><text x="242" y="186" class="bl" fill="#3a4652">DC removal → trim silence (40 dB) → 7 kHz low-pass</text><text x="242" y="202" class="bl" fill="#3a4652">(10th-order Butterworth) → RMS normalize to 0.05</text><rect x="230" y="246" width="440" height="60" rx="8" fill="#e3edf8" stroke="#3d6fa3" stroke-width="1.6"/><text x="242" y="267" class="bt" fill="#1b2430">4 s window = 64,000 samples</text><text x="242" y="286" class="bl" fill="#3a4652">inference &#x27;win3&#x27;: up to 3 evenly spaced windows, logits averaged</text><rect x="150" y="336" width="600" height="62" rx="8" fill="#f4f8f8" stroke="#0c6b6b" stroke-width="1.6" stroke-dasharray="6 4"/><text x="162" y="357" class="bt" fill="#1b2430">XLS-R feature encoder: 7 convolution layers (frozen)</text><text x="162" y="376" class="bl" fill="#3a4652">raw samples → one 512-dim vector every 20 ms → 199 frames</text><rect x="150" y="422" width="600" height="46" rx="8" fill="#dff1ef" stroke="#0c6b6b" stroke-width="1.6"/><text x="162" y="443" class="bt" fill="#1b2430">Feature projection 512 → 1024  +  positional convolution</text><rect x="150" y="492" width="600" height="94" rx="8" fill="#dff1ef" stroke="#0c6b6b" stroke-width="1.6"/><text x="162" y="513" class="bt" fill="#1b2430">Transformer blocks 1–12 of 24 (fine-tuned; 13–24 removed)</text><text x="162" y="532" class="bl" fill="#3a4652">each block: 16-head self-attention + feed-forward (1024 → 4096 → 1024)</text><text x="162" y="548" class="bl" fill="#3a4652">every frame can look at every other frame in the 4 s</text><text x="162" y="564" class="bl" fill="#3a4652">outputs 13 hidden states (projection + 12 blocks), each 199 × 1024</text><rect x="150" y="620" width="600" height="46" rx="8" fill="#dff1ef" stroke="#0c6b6b" stroke-width="1.6"/><text x="162" y="641" class="bt" fill="#1b2430">Learned softmax weights over the 13 layers → one 199 × 1024 sequence</text><rect x="150" y="690" width="600" height="46" rx="8" fill="#dff1ef" stroke="#0c6b6b" stroke-width="1.6"/><text x="162" y="711" class="bt" fill="#1b2430">Linear 1024 → 256 per frame</text><rect x="150" y="760" width="600" height="78" rx="8" fill="#dff1ef" stroke="#0c6b6b" stroke-width="1.6"/><text x="162" y="781" class="bt" fill="#1b2430">Attentive statistics pooling</text><text x="162" y="800" class="bl" fill="#3a4652">a small net (256 → 128 → tanh → 1) scores each frame; softmax over frames</text><text x="162" y="816" class="bl" fill="#3a4652">weighted mean (256) + weighted std (256) → 512</text><rect x="150" y="862" width="600" height="46" rx="8" fill="#dff1ef" stroke="#0c6b6b" stroke-width="1.6"/><text x="162" y="883" class="bt" fill="#1b2430">Linear 512 → 1  →  logit (higher = more fake)</text><rect x="300" y="932" width="300" height="34" rx="8" fill="#1b2430" stroke="#1b2430" stroke-width="1.6"/><text x="312" y="953" class="bt" fill="#ffffff">score (margin)</text><path d="M450.0,122 L450.0,144" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M450.0,222 L450.0,244" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M450.0,306 L450.0,334" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M450.0,398 L450.0,420" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M450.0,468 L450.0,490" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M450.0,586 L450.0,618" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M450.0,666 L450.0,688" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M450.0,736 L450.0,758" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M450.0,838 L450.0,860" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M450.0,908 L450.0,930" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><text x="770" y="360" class="al">pretrained</text><text x="770" y="520" class="al">pretrained,</text><text x="770" y="536" class="al">then fine-tuned</text><text x="770" y="700" class="al">new &#x27;light&#x27;</text><text x="770" y="716" class="al">back end,</text><text x="770" y="732" class="al">trained from</text><text x="770" y="748" class="al">scratch</text><rect x="24" y="984" width="14" height="12" rx="2" fill="#eef1f4" stroke="#6b7784"/><text x="44" y="994" class="k">data</text><rect x="80.4" y="984" width="14" height="12" rx="2" fill="#e3edf8" stroke="#3d6fa3"/><text x="100.4" y="994" class="k">preprocessing / features</text><rect x="268.79999999999995" y="984" width="14" height="12" rx="2" fill="#dff1ef" stroke="#0c6b6b"/><text x="288.79999999999995" y="994" class="k">trained</text><rect x="344.99999999999994" y="984" width="14" height="12" rx="2" fill="#f4f8f8" stroke="#0c6b6b" stroke-dasharray="6 4"/><text x="364.99999999999994" y="994" class="k">frozen, pretrained</text><rect x="493.79999999999995" y="984" width="14" height="12" rx="2" fill="#fbf0dc" stroke="#a8620f"/><text x="513.8" y="994" class="k">fusion / decision</text><rect x="636.0" y="984" width="14" height="12" rx="2" fill="#1b2430" stroke="#1b2430"/><text x="656.0" y="994" class="k">output</text></svg>