<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1060" width="900" height="1060" font-family="Segoe UI, Helvetica, Arial, sans-serif"><style>.t{font-size:20px;font-weight:700;fill:#1b2430}.s{font-size:13px;fill:#5d6975}.bt{font-size:14px;font-weight:600}.bl{font-size:12px}.al{font-size:11.5px;fill:#5d6975;font-style:italic}.k{font-size:11px;fill:#5d6975}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6975"/></marker></defs><rect width="900" height="1060" fill="#ffffff"/><text x="24" y="34" class="t">Data in and out: what was given, what we collected, how every clip is prepared</text><text x="24" y="56" class="s">Counts are clips after cleaning (English, ≥ 3 s). The 1,671 HGT test clips are only ever scored.</text><rect x="20" y="76" width="206" height="140" rx="8" fill="#eef1f4" stroke="#6b7784" stroke-width="1.6"/><text x="32" y="97" class="bt" fill="#1b2430">Given by the organizers</text><text x="32" y="116" class="bl" fill="#3a4652">DiffSSD: 69,450 fakes,</text><text x="32" y="132" class="bl" fill="#3a4652">10 generators</text><text x="32" y="148" class="bl" fill="#3a4652">242 LJSpeech reals</text><text x="32" y="164" class="bl" fill="#3a4652">1,671 HGT test clips</text><text x="32" y="180" class="bl" fill="#3a4652">AASIST weights + scorer</text><rect x="238" y="76" width="206" height="140" rx="8" fill="#eef1f4" stroke="#6b7784" stroke-width="1.6"/><text x="250" y="97" class="bt" fill="#1b2430">Collected online (11 corpora)</text><text x="250" y="116" class="bl" fill="#3a4652">56,720 real / 54,299 fake</text><text x="250" y="132" class="bl" fill="#3a4652">LJSpeech, LibriSpeech,</text><text x="250" y="148" class="bl" fill="#3a4652">WaveFake, In-the-Wild,</text><text x="250" y="164" class="bl" fill="#3a4652">ASVspoof 2019 LA + 5,</text><text x="250" y="180" class="bl" fill="#3a4652">LibriSeVoc, SONAR, DFADD,</text><text x="250" y="196" class="bl" fill="#3a4652">MLAAD-tiny, CVoiceFake</text><rect x="456" y="76" width="206" height="140" rx="8" fill="#eef1f4" stroke="#6b7784" stroke-width="1.6"/><text x="468" y="97" class="bt" fill="#1b2430">Public benchmarks</text><text x="468" y="116" class="bl" fill="#3a4652">R6 on: 6,155 clips from</text><text x="468" y="132" class="bl" fill="#3a4652">ASVspoof 2021 DF, CD-ADD,</text><text x="468" y="148" class="bl" fill="#3a4652">DECRO-en (trained on)</text><text x="468" y="164" class="bl" fill="#3a4652">DeepVoice: 2,114 clips,</text><text x="468" y="180" class="bl" fill="#3a4652">test only, never trained</text><rect x="674" y="76" width="206" height="140" rx="8" fill="#eef1f4" stroke="#6b7784" stroke-width="1.6"/><text x="686" y="97" class="bt" fill="#1b2430">Made by us</text><text x="686" y="116" class="bl" fill="#3a4652">Simulator: 5,204 fakes</text><text x="686" y="132" class="bl" fill="#3a4652">copy-synthesis vocoders</text><text x="686" y="148" class="bl" fill="#3a4652">(HiFi-GAN, Griffin-Lim …)</text><text x="686" y="164" class="bl" fill="#3a4652">+ open TTS (VITS, MMS,</text><text x="686" y="180" class="bl" fill="#3a4652">SpeechT5) in LJ and</text><text x="686" y="196" class="bl" fill="#3a4652">LibriSpeech voices</text><rect x="150" y="256" width="600" height="78" rx="8" fill="#e3edf8" stroke="#3d6fa3" stroke-width="1.6"/><text x="162" y="277" class="bt" fill="#1b2430">Canonical clip  (clean_given.py, ingest_*.py, run_sim.py)</text><text x="162" y="296" class="bl" fill="#3a4652">decode any format → mono → resample to 16 kHz → PCM16 WAV · drop clips &lt; 3 s</text><text x="162" y="312" class="bl" fill="#3a4652">one manifest row per clip: label, source, generator, speaker, text id, licence</text><path d="M123.0,216 L123.0,236.0 L270.0,236.0 L270.0,254" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M341.0,216 L341.0,236.0 L390.0,236.0 L390.0,254" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M559.0,216 L559.0,236.0 L510.0,236.0 L510.0,254" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M777.0,216 L777.0,236.0 L630.0,236.0 L630.0,254" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><rect x="150" y="364" width="600" height="62" rx="8" fill="#e3edf8" stroke="#3d6fa3" stroke-width="1.6"/><text x="162" y="385" class="bt" fill="#1b2430">Manifest + grouped splits  (make_splits.py): 193,585 clips</text><text x="162" y="404" class="bl" fill="#3a4652">a speaker + text never spans two splits · frozen eval subsets in splits/</text><path d="M450.0,334 L450.0,362" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><rect x="20" y="456" width="206" height="74" rx="8" fill="#eef1f4" stroke="#6b7784" stroke-width="1.6"/><text x="32" y="477" class="bt" fill="#1b2430">train</text><text x="32" y="496" class="bl" fill="#3a4652">141,591 clips</text><path d="M270.0,426 L270.0,441.0 L123.0,441.0 L123.0,454" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><rect x="238" y="456" width="206" height="74" rx="8" fill="#eef1f4" stroke="#6b7784" stroke-width="1.6"/><text x="250" y="477" class="bt" fill="#1b2430">val</text><text x="250" y="496" class="bl" fill="#3a4652">19,328 · val_testlike</text><text x="250" y="512" class="bl" fill="#3a4652">8,963 (70/30 mix)</text><path d="M390.0,426 L390.0,441.0 L341.0,441.0 L341.0,454" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><rect x="456" y="456" width="206" height="74" rx="8" fill="#eef1f4" stroke="#6b7784" stroke-width="1.6"/><text x="468" y="477" class="bt" fill="#1b2430">test_internal</text><text x="468" y="496" class="bl" fill="#3a4652">20,676 · testlike 9,747</text><text x="468" y="512" class="bl" fill="#3a4652">report-only headline</text><path d="M510.0,426 L510.0,441.0 L559.0,441.0 L559.0,454" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><rect x="674" y="456" width="206" height="74" rx="8" fill="#eef1f4" stroke="#6b7784" stroke-width="1.6"/><text x="686" y="477" class="bt" fill="#1b2430">excluded</text><text x="686" y="496" class="bl" fill="#3a4652">11,990 fakes of 3 held-</text><text x="686" y="512" class="bl" fill="#3a4652">out DiffSSD generators</text><path d="M630.0,426 L630.0,441.0 L777.0,441.0 L777.0,454" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><rect x="20" y="570" width="424" height="94" rx="8" fill="#e3edf8" stroke="#3d6fa3" stroke-width="1.6"/><text x="32" y="591" class="bt" fill="#1b2430">Training clips only: augment()</text><text x="32" y="610" class="bl" fill="#3a4652">RawBoost channel noise 60 % (R7a only)</text><text x="32" y="626" class="bl" fill="#3a4652">then MP3 round trip 25 % · noise 15–40 dB SNR 20 %</text><text x="32" y="642" class="bl" fill="#3a4652">· resampler round trip 15 % (same for real and fake)</text><rect x="456" y="570" width="424" height="94" rx="8" fill="#e3edf8" stroke="#3d6fa3" stroke-width="1.6"/><text x="468" y="591" class="bt" fill="#1b2430">Validation, test and HGT clips: no augmentation</text><text x="468" y="610" class="bl" fill="#3a4652">the 1,671 HGT clips join here, straight from the</text><text x="468" y="626" class="bl" fill="#3a4652">canonical step; they are never in the manifest</text><text x="468" y="642" class="bl" fill="#3a4652">and never used to choose anything</text><path d="M123.0,530 L123.0,550.0 L232.0,550.0 L232.0,568" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M341.0,530 L341.0,550.0 L568.0,550.0 L568.0,568" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M559.0,530 L559.0,550.0 L768.0,550.0 L768.0,568" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><rect x="150" y="700" width="600" height="62" rx="8" fill="#e3edf8" stroke="#3d6fa3" stroke-width="1.6"/><text x="162" y="721" class="bt" fill="#1b2430">prep()  (every clip, train and test)</text><text x="162" y="740" class="bl" fill="#3a4652">DC removal → trim silence (40 dB) → 7 kHz low-pass (Butterworth) → RMS normalize to 0.05</text><path d="M232.0,664 L232.0,682.0 L300.0,682.0 L300.0,698" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M668.0,664 L668.0,682.0 L600.0,682.0 L600.0,698" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><rect x="20" y="796" width="424" height="62" rx="8" fill="#e3edf8" stroke="#3d6fa3" stroke-width="1.6"/><text x="32" y="817" class="bt" fill="#1b2430">R1 input: 228 features on a 3–4 s crop</text><text x="32" y="836" class="bl" fill="#3a4652">LFCC / MFCC / spectral shape 0–7 kHz + 48 biology features</text><rect x="456" y="796" width="424" height="62" rx="8" fill="#e3edf8" stroke="#3d6fa3" stroke-width="1.6"/><text x="468" y="817" class="bt" fill="#1b2430">XLS-R input (R4ft, R6, R7a): 4 s windows</text><text x="468" y="836" class="bl" fill="#3a4652">train: random crop · score: up to 3 windows, averaged</text><path d="M300.0,762 L300.0,779.0 L232.0,779.0 L232.0,794" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M600.0,762 L600.0,779.0 L668.0,779.0 L668.0,794" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><rect x="150" y="892" width="600" height="62" rx="8" fill="#fbf0dc" stroke="#a8620f" stroke-width="1.6"/><text x="162" y="913" class="bt" fill="#1b2430">Four models → E7 logistic-regression fusion</text><text x="162" y="932" class="bl" fill="#3a4652">fit on val_testlike only (e7_fusion.svg)</text><path d="M232.0,858 L232.0,875.0 L300.0,875.0 L300.0,890" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M668.0,858 L668.0,875.0 L600.0,875.0 L600.0,890" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><rect x="250" y="980" width="400" height="40" rx="8" fill="#1b2430" stroke="#1b2430" stroke-width="1.6"/><text x="262" y="1001" class="bt" fill="#ffffff">submission .tsv: 1,671 scores, higher = real</text><path d="M450.0,954 L450.0,978" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><rect x="24" y="1034" width="14" height="12" rx="2" fill="#eef1f4" stroke="#6b7784"/><text x="44" y="1044" class="k">data</text><rect x="80.4" y="1034" width="14" height="12" rx="2" fill="#e3edf8" stroke="#3d6fa3"/><text x="100.4" y="1044" class="k">preprocessing / features</text><rect x="268.79999999999995" y="1034" width="14" height="12" rx="2" fill="#dff1ef" stroke="#0c6b6b"/><text x="288.79999999999995" y="1044" class="k">trained</text><rect x="344.99999999999994" y="1034" width="14" height="12" rx="2" fill="#f4f8f8" stroke="#0c6b6b" stroke-dasharray="6 4"/><text x="364.99999999999994" y="1044" class="k">frozen, pretrained</text><rect x="493.79999999999995" y="1034" width="14" height="12" rx="2" fill="#fbf0dc" stroke="#a8620f"/><text x="513.8" y="1044" class="k">fusion / decision</text><rect x="636.0" y="1034" width="14" height="12" rx="2" fill="#1b2430" stroke="#1b2430"/><text x="656.0" y="1044" class="k">output</text></svg>