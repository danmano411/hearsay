<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" width="900" height="740" font-family="Segoe UI, Helvetica, Arial, sans-serif"><style>.t{font-size:20px;font-weight:700;fill:#1b2430}.s{font-size:13px;fill:#5d6975}.bt{font-size:14px;font-weight:600}.bl{font-size:12px}.al{font-size:11.5px;fill:#5d6975;font-style:italic}.k{font-size:11px;fill:#5d6975}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6975"/></marker></defs><rect width="900" height="740" fill="#ffffff"/><text x="24" y="34" class="t">E5 · fusion of R4ft, R6 and R1 (previous final; the model CallGuard uses)</text><text x="24" y="56" class="s">Two independently trained XLS-R models plus the classic model; chosen by the pre-registered Stage 10 rule.</text><rect x="30.0" y="76" width="260" height="80" rx="8" fill="#dff1ef" stroke="#0c6b6b" stroke-width="1.6"/><text x="42.0" y="97" class="bt" fill="#1b2430">R4ft: XLS-R, win3</text><text x="42.0" y="116" class="bl" fill="#3a4652">logit, higher = fake</text><text x="42.0" y="132" class="bl" fill="#3a4652">seed 0, original data</text><rect x="30.0" y="186" width="260" height="62" rx="8" fill="#e3edf8" stroke="#3d6fa3" stroke-width="1.6"/><text x="42.0" y="207" class="bt" fill="#1b2430">transform</text><text x="42.0" y="226" class="bl" fill="#3a4652">margin: as-is</text><rect x="30.0" y="278" width="260" height="62" rx="8" fill="#e3edf8" stroke="#3d6fa3" stroke-width="1.6"/><text x="42.0" y="299" class="bt" fill="#1b2430">standardize</text><text x="42.0" y="318" class="bl" fill="#3a4652">z = (x − μ) / σ, from val_testlike</text><path d="M160.0,156 L160.0,184" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M160.0,248 L160.0,276" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><rect x="320.0" y="76" width="260" height="80" rx="8" fill="#dff1ef" stroke="#0c6b6b" stroke-width="1.6"/><text x="332.0" y="97" class="bt" fill="#1b2430">R6: XLS-R, win3</text><text x="332.0" y="116" class="bl" fill="#3a4652">logit, higher = fake</text><text x="332.0" y="132" class="bl" fill="#3a4652">seed 1, + 6,155 clips</text><rect x="320.0" y="186" width="260" height="62" rx="8" fill="#e3edf8" stroke="#3d6fa3" stroke-width="1.6"/><text x="332.0" y="207" class="bt" fill="#1b2430">transform</text><text x="332.0" y="226" class="bl" fill="#3a4652">margin: as-is</text><rect x="320.0" y="278" width="260" height="62" rx="8" fill="#e3edf8" stroke="#3d6fa3" stroke-width="1.6"/><text x="332.0" y="299" class="bt" fill="#1b2430">standardize</text><text x="332.0" y="318" class="bl" fill="#3a4652">z = (x − μ) / σ, from val_testlike</text><path d="M450.0,156 L450.0,184" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M450.0,248 L450.0,276" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><rect x="610.0" y="76" width="260" height="80" rx="8" fill="#dff1ef" stroke="#0c6b6b" stroke-width="1.6"/><text x="622.0" y="97" class="bt" fill="#1b2430">R1: LightGBM (refit)</text><text x="622.0" y="116" class="bl" fill="#3a4652">p(fake) in [0, 1]</text><text x="622.0" y="132" class="bl" fill="#3a4652">228 features</text><rect x="610.0" y="186" width="260" height="62" rx="8" fill="#e3edf8" stroke="#3d6fa3" stroke-width="1.6"/><text x="622.0" y="207" class="bt" fill="#1b2430">transform</text><text x="622.0" y="226" class="bl" fill="#3a4652">logit: log(p / (1 − p))</text><rect x="610.0" y="278" width="260" height="62" rx="8" fill="#e3edf8" stroke="#3d6fa3" stroke-width="1.6"/><text x="622.0" y="299" class="bt" fill="#1b2430">standardize</text><text x="622.0" y="318" class="bl" fill="#3a4652">z = (x − μ) / σ, from val_testlike</text><path d="M740.0,156 L740.0,184" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M740.0,248 L740.0,276" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><rect x="150" y="380" width="600" height="94" rx="8" fill="#fbf0dc" stroke="#a8620f" stroke-width="1.6"/><text x="162" y="401" class="bt" fill="#1b2430">Logistic regression (the fusion)</text><text x="162" y="420" class="bl" fill="#3a4652">6.00 × z(R4ft) + 3.92 × z(R6) + 1.69 × z(R1)</text><text x="162" y="436" class="bl" fill="#3a4652">intercept −1.31; fit on val_testlike only</text><text x="162" y="452" class="bl" fill="#3a4652">(its honest score comes from 5-fold group cross-fitting)</text><path d="M160.0,340 L160.0,360.0 L450.0,360.0 L450.0,378" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M450.0,340 L450.0,378" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M740.0,340 L740.0,360.0 L450.0,360.0 L450.0,378" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><rect x="250" y="504" width="400" height="46" rx="8" fill="#fbf0dc" stroke="#a8620f" stroke-width="1.6"/><text x="262" y="525" class="bt" fill="#1b2430">fused margin (higher = more fake)</text><rect x="150" y="580" width="600" height="62" rx="8" fill="#e3edf8" stroke="#3d6fa3" stroke-width="1.6"/><text x="162" y="601" class="bt" fill="#1b2430">sigmoid(margin / 7) → p(fake), then write 1 − p</text><text x="162" y="620" class="bl" fill="#3a4652">temperature 7: stops ties at 10 digits · 1 − p: the scorer reads higher = real</text><rect x="250" y="664" width="400" height="34" rx="8" fill="#1b2430" stroke="#1b2430" stroke-width="1.6"/><text x="262" y="685" class="bt" fill="#ffffff">submission .tsv (1,671 rows)</text><path d="M450.0,474 L450.0,502" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M450.0,550 L450.0,578" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M450.0,642 L450.0,662" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><rect x="24" y="714" width="14" height="12" rx="2" fill="#eef1f4" stroke="#6b7784"/><text x="44" y="724" class="k">data</text><rect x="80.4" y="714" width="14" height="12" rx="2" fill="#e3edf8" stroke="#3d6fa3"/><text x="100.4" y="724" class="k">preprocessing / features</text><rect x="268.79999999999995" y="714" width="14" height="12" rx="2" fill="#dff1ef" stroke="#0c6b6b"/><text x="288.79999999999995" y="724" class="k">trained</text><rect x="344.99999999999994" y="714" width="14" height="12" rx="2" fill="#f4f8f8" stroke="#0c6b6b" stroke-dasharray="6 4"/><text x="364.99999999999994" y="724" class="k">frozen, pretrained</text><rect x="493.79999999999995" y="714" width="14" height="12" rx="2" fill="#fbf0dc" stroke="#a8620f"/><text x="513.8" y="724" class="k">fusion / decision</text><rect x="636.0" y="714" width="14" height="12" rx="2" fill="#1b2430" stroke="#1b2430"/><text x="656.0" y="724" class="k">output</text></svg>