<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif"><style>.t{font-size:20px;font-weight:700;fill:#1b2430}.s{font-size:13px;fill:#5d6975}.bt{font-size:14px;font-weight:600}.bl{font-size:12px}.al{font-size:11.5px;fill:#5d6975;font-style:italic}.k{font-size:11px;fill:#5d6975}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6975"/></marker></defs><rect width="900" height="560" fill="#ffffff"/><text x="24" y="34" class="t">R0 · trivial cues (a leak detector, not a real model)</text><text x="24" y="56" class="s">If 9 non-speech statistics can separate real from fake, the data leaks. Run twice: raw audio, then after prep().</text><rect x="240" y="80" width="420" height="50" rx="8" fill="#eef1f4" stroke="#6b7784" stroke-width="1.6"/><text x="252" y="101" class="bt" fill="#1b2430">Audio clip, 16 kHz mono</text><rect x="60" y="170" width="330" height="60" rx="8" fill="#eef1f4" stroke="#6b7784" stroke-width="1.6"/><text x="72" y="191" class="bt" fill="#1b2430">Path A: raw audio</text><text x="72" y="210" class="bl" fill="#3a4652">no preprocessing</text><rect x="470" y="162" width="370" height="76" rx="8" fill="#e3edf8" stroke="#3d6fa3" stroke-width="1.6"/><text x="482" y="183" class="bt" fill="#1b2430">prep()  (every clip, train and test)</text><text x="482" y="202" class="bl" fill="#3a4652">DC removal → trim silence (40 dB) → 7 kHz low-pass</text><text x="482" y="218" class="bl" fill="#3a4652">(10th-order Butterworth) → RMS normalize to 0.05</text><rect x="170" y="280" width="560" height="92" rx="8" fill="#e3edf8" stroke="#3d6fa3" stroke-width="1.6"/><text x="182" y="301" class="bt" fill="#1b2430">9 trivial statistics per clip</text><text x="182" y="320" class="bl" fill="#3a4652">duration · peak level · RMS · clipping fraction · DC offset</text><text x="182" y="336" class="bl" fill="#3a4652">leading silence · trailing silence · 95 % roll-off · bandwidth (bw60)</text><rect x="250" y="410" width="400" height="60" rx="8" fill="#dff1ef" stroke="#0c6b6b" stroke-width="1.6"/><text x="262" y="431" class="bt" fill="#1b2430">Depth-3 decision tree  or  LightGBM</text><text x="262" y="450" class="bl" fill="#3a4652">trained on the train split</text><rect x="300" y="496" width="300" height="34" rx="8" fill="#1b2430" stroke="#1b2430" stroke-width="1.6"/><text x="312" y="517" class="bt" fill="#ffffff">p(fake)</text><path d="M450.0,130 L450.0,150.0 L225.0,150.0 L225.0,168" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M450.0,130 L450.0,146.0 L655.0,146.0 L655.0,160" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M225.0,230 L225.0,255.0 L450.0,255.0 L450.0,278" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M655.0,238 L655.0,259.0 L450.0,259.0 L450.0,278" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M450.0,372 L450.0,408" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M450.0,470 L450.0,494" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><text x="660" y="438" class="al">raw: 0.572 (leaks)</text><text x="660" y="454" class="al">after prep(): 0.921 (≈ chance: good)</text><rect x="24" y="534" width="14" height="12" rx="2" fill="#eef1f4" stroke="#6b7784"/><text x="44" y="544" class="k">data</text><rect x="80.4" y="534" width="14" height="12" rx="2" fill="#e3edf8" stroke="#3d6fa3"/><text x="100.4" y="544" class="k">preprocessing / features</text><rect x="268.79999999999995" y="534" width="14" height="12" rx="2" fill="#dff1ef" stroke="#0c6b6b"/><text x="288.79999999999995" y="544" class="k">trained</text><rect x="344.99999999999994" y="534" width="14" height="12" rx="2" fill="#f4f8f8" stroke="#0c6b6b" stroke-dasharray="6 4"/><text x="364.99999999999994" y="544" class="k">frozen, pretrained</text><rect x="493.79999999999995" y="534" width="14" height="12" rx="2" fill="#fbf0dc" stroke="#a8620f"/><text x="513.8" y="544" class="k">fusion / decision</text><rect x="636.0" y="534" width="14" height="12" rx="2" fill="#1b2430" stroke="#1b2430"/><text x="656.0" y="544" class="k">output</text></svg>