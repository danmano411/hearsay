<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1010" width="900" height="1010" font-family="Segoe UI, Helvetica, Arial, sans-serif"><style>.t{font-size:20px;font-weight:700;fill:#1b2430}.s{font-size:13px;fill:#5d6975}.bt{font-size:14px;font-weight:600}.bl{font-size:12px}.al{font-size:11.5px;fill:#5d6975;font-style:italic}.k{font-size:11px;fill:#5d6975}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6975"/></marker></defs><rect width="900" height="1010" fill="#ffffff"/><text x="24" y="34" class="t">R3 · AASIST (the organizers&#x27; baseline), used zero-shot</text><text x="24" y="56" class="s">Graph attention over spectral and temporal nodes. Pretrained on ASVspoof 5; on our data 0.823 (does not transfer).</text><rect x="230" y="76" width="440" height="50" rx="8" fill="#eef1f4" stroke="#6b7784" stroke-width="1.6"/><text x="242" y="97" class="bt" fill="#1b2430">Raw waveform, 64,600 samples (≈ 4.04 s)</text><text x="242" y="116" class="bl" fill="#3a4652">short clips tiled, long clips cropped</text><rect x="230" y="150" width="440" height="62" rx="8" fill="#f4f8f8" stroke="#0c6b6b" stroke-width="1.6" stroke-dasharray="6 4"/><text x="242" y="171" class="bt" fill="#1b2430">Sinc convolution: 70 learnable band-pass filters</text><text x="242" y="190" class="bl" fill="#3a4652">each filter = a sinc function with learned cut-offs (kernel 128)</text><rect x="230" y="236" width="440" height="46" rx="8" fill="#f4f8f8" stroke="#0c6b6b" stroke-width="1.6" stroke-dasharray="6 4"/><text x="242" y="257" class="bt" fill="#1b2430">|x| → max-pool 3×3 → batch norm → SELU</text><rect x="230" y="306" width="440" height="62" rx="8" fill="#f4f8f8" stroke="#0c6b6b" stroke-width="1.6" stroke-dasharray="6 4"/><text x="242" y="327" class="bt" fill="#1b2430">Residual CNN encoder: 6 blocks</text><text x="242" y="346" class="bl" fill="#3a4652">channels 32 · 32 · 64 · 64 · 64 · 64  →  feature map (channels × freq × time)</text><rect x="60" y="400" width="370" height="78" rx="8" fill="#f4f8f8" stroke="#0c6b6b" stroke-width="1.6" stroke-dasharray="6 4"/><text x="72" y="421" class="bt" fill="#1b2430">Spectral graph</text><text x="72" y="440" class="bl" fill="#3a4652">nodes = frequency bands (max over time)</text><text x="72" y="456" class="bl" fill="#3a4652">+ position embedding → graph attention → pool</text><rect x="470" y="400" width="370" height="78" rx="8" fill="#f4f8f8" stroke="#0c6b6b" stroke-width="1.6" stroke-dasharray="6 4"/><text x="482" y="421" class="bt" fill="#1b2430">Temporal graph</text><text x="482" y="440" class="bl" fill="#3a4652">nodes = time steps (max over frequency)</text><text x="482" y="456" class="bl" fill="#3a4652">graph attention → pool</text><rect x="60" y="512" width="370" height="94" rx="8" fill="#f4f8f8" stroke="#0c6b6b" stroke-width="1.6" stroke-dasharray="6 4"/><text x="72" y="533" class="bt" fill="#1b2430">HS-GAL branch 1</text><text x="72" y="552" class="bl" fill="#3a4652">heterogeneous graph: spectral + temporal</text><text x="72" y="568" class="bl" fill="#3a4652">nodes together, plus a learned &#x27;master&#x27; node</text><text x="72" y="584" class="bl" fill="#3a4652">that attends to both · 2 layers + pooling</text><rect x="470" y="512" width="370" height="94" rx="8" fill="#f4f8f8" stroke="#0c6b6b" stroke-width="1.6" stroke-dasharray="6 4"/><text x="482" y="533" class="bt" fill="#1b2430">HS-GAL branch 2</text><text x="482" y="552" class="bl" fill="#3a4652">same structure, its own weights and</text><text x="482" y="568" class="bl" fill="#3a4652">master node</text><text x="482" y="584" class="bl" fill="#3a4652">2 layers + pooling</text><rect x="230" y="640" width="440" height="46" rx="8" fill="#f4f8f8" stroke="#0c6b6b" stroke-width="1.6" stroke-dasharray="6 4"/><text x="242" y="661" class="bt" fill="#1b2430">Element-wise max of the two branches</text><rect x="230" y="710" width="440" height="78" rx="8" fill="#f4f8f8" stroke="#0c6b6b" stroke-width="1.6" stroke-dasharray="6 4"/><text x="242" y="731" class="bt" fill="#1b2430">Readout → 160 values</text><text x="242" y="750" class="bl" fill="#3a4652">max and mean of temporal nodes · max and mean of</text><text x="242" y="766" class="bl" fill="#3a4652">spectral nodes · master node (5 × 32)</text><rect x="230" y="812" width="440" height="46" rx="8" fill="#f4f8f8" stroke="#0c6b6b" stroke-width="1.6" stroke-dasharray="6 4"/><text x="242" y="833" class="bt" fill="#1b2430">Linear 160 → 2 logits (spoof, bonafide)</text><rect x="230" y="884" width="440" height="50" rx="8" fill="#1b2430" stroke="#1b2430" stroke-width="1.6"/><text x="242" y="905" class="bt" fill="#ffffff">Our score = logit(spoof) − logit(bonafide)</text><text x="242" y="924" class="bl" fill="#dfe6ec">higher = more fake</text><path d="M450.0,126 L450.0,148" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M450.0,212 L450.0,234" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M450.0,282 L450.0,304" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M450.0,368 L450.0,384.0 L245.0,384.0 L245.0,398" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M450.0,368 L450.0,384.0 L655.0,384.0 L655.0,398" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M245.0,478 L245.0,510" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M655.0,478 L655.0,495.0 L245.0,495.0 L245.0,510" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M245.0,478 L245.0,495.0 L655.0,495.0 L655.0,510" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M655.0,478 L655.0,510" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M245.0,606 L245.0,623.0 L450.0,623.0 L450.0,638" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M655.0,606 L655.0,623.0 L450.0,623.0 L450.0,638" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M450.0,686 L450.0,708" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M450.0,788 L450.0,810" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M450.0,858 L450.0,882" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><text x="24" y="960" class="al">Every block is frozen: we used the organizers&#x27; weights as-is, after prep(), one 4 s window per clip.</text><rect x="24" y="984" width="14" height="12" rx="2" fill="#eef1f4" stroke="#6b7784"/><text x="44" y="994" class="k">data</text><rect x="80.4" y="984" width="14" height="12" rx="2" fill="#e3edf8" stroke="#3d6fa3"/><text x="100.4" y="994" class="k">preprocessing / features</text><rect x="268.79999999999995" y="984" width="14" height="12" rx="2" fill="#dff1ef" stroke="#0c6b6b"/><text x="288.79999999999995" y="994" class="k">trained</text><rect x="344.99999999999994" y="984" width="14" height="12" rx="2" fill="#f4f8f8" stroke="#0c6b6b" stroke-dasharray="6 4"/><text x="364.99999999999994" y="994" class="k">frozen, pretrained</text><rect x="493.79999999999995" y="984" width="14" height="12" rx="2" fill="#fbf0dc" stroke="#a8620f"/><text x="513.8" y="994" class="k">fusion / decision</text><rect x="636.0" y="984" width="14" height="12" rx="2" fill="#1b2430" stroke="#1b2430"/><text x="656.0" y="994" class="k">output</text></svg>