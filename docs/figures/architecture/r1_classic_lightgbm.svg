<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780" width="900" height="780" font-family="Segoe UI, Helvetica, Arial, sans-serif"><style>.t{font-size:20px;font-weight:700;fill:#1b2430}.s{font-size:13px;fill:#5d6975}.bt{font-size:14px;font-weight:600}.bl{font-size:12px}.al{font-size:11.5px;fill:#5d6975;font-style:italic}.k{font-size:11px;fill:#5d6975}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6975"/></marker></defs><rect width="900" height="780" fill="#ffffff"/><text x="24" y="34" class="t">R1 · classic features + LightGBM</text><text x="24" y="56" class="s">228 hand-made features per clip, gradient-boosted trees. Headline 0.253 (EER 6.6 %).</text><rect x="240" y="76" width="420" height="46" rx="8" fill="#eef1f4" stroke="#6b7784" stroke-width="1.6"/><text x="252" y="97" class="bt" fill="#1b2430">Audio clip, 16 kHz mono</text><rect x="240" y="150" width="420" height="60" rx="8" fill="#e3edf8" stroke="#3d6fa3" stroke-width="1.6"/><text x="252" y="171" class="bt" fill="#1b2430">augment()  (training only, same for both classes)</text><text x="252" y="190" class="bl" fill="#3a4652">MP3 round trip 25 % · noise 15–40 dB SNR 20 % · resample 15 %</text><rect x="240" y="234" width="420" height="76" rx="8" fill="#e3edf8" stroke="#3d6fa3" stroke-width="1.6"/><text x="252" y="255" class="bt" fill="#1b2430">prep()  (every clip, train and test)</text><text x="252" y="274" class="bl" fill="#3a4652">DC removal → trim silence (40 dB) → 7 kHz low-pass</text><text x="252" y="290" class="bl" fill="#3a4652">(10th-order Butterworth) → RMS normalize to 0.05</text><rect x="240" y="334" width="420" height="46" rx="8" fill="#e3edf8" stroke="#3d6fa3" stroke-width="1.6"/><text x="252" y="355" class="bt" fill="#1b2430">Crop: random 3–4 s (train) · centre 4 s (eval)</text><rect x="60" y="410" width="380" height="108" rx="8" fill="#e3edf8" stroke="#3d6fa3" stroke-width="1.6"/><text x="72" y="431" class="bt" fill="#1b2430">Spectral features (180), 0–7 kHz</text><text x="72" y="450" class="bl" fill="#3a4652">LFCC 20 + deltas (mean, std)</text><text x="72" y="466" class="bl" fill="#3a4652">MFCC 20 + deltas (mean, std)</text><text x="72" y="482" class="bl" fill="#3a4652">centroid · bandwidth · roll-off · flatness</text><text x="72" y="498" class="bl" fill="#3a4652">6-band spectral contrast</text><rect x="460" y="410" width="380" height="108" rx="8" fill="#e3edf8" stroke="#3d6fa3" stroke-width="1.6"/><text x="472" y="431" class="bt" fill="#1b2430">Speech-biology features (48)</text><text x="472" y="450" class="bl" fill="#3a4652">phonation / pitch 17 (jitter, shimmer, HNR, tilt…)</text><text x="472" y="466" class="bl" fill="#3a4652">articulation 13 (formants, their speed, VTL)</text><text x="472" y="482" class="bl" fill="#3a4652">rhythm 6 · respiration 6 · turbulence 3 (4–7 kHz)</text><text x="472" y="498" class="bl" fill="#3a4652">phase 3 (group delay)</text><rect x="300" y="550" width="300" height="40" rx="8" fill="#e3edf8" stroke="#3d6fa3" stroke-width="1.6"/><text x="312" y="571" class="bt" fill="#1b2430">228-dim feature vector</text><rect x="240" y="616" width="420" height="62" rx="8" fill="#dff1ef" stroke="#0c6b6b" stroke-width="1.6"/><text x="252" y="637" class="bt" fill="#1b2430">LightGBM (gradient-boosted decision trees)</text><text x="252" y="656" class="bl" fill="#3a4652">class-balanced · leaves chosen on val_testlike · early stopping</text><rect x="330" y="700" width="240" height="34" rx="8" fill="#1b2430" stroke="#1b2430" stroke-width="1.6"/><text x="342" y="721" class="bt" fill="#ffffff">p(fake)</text><path d="M450.0,122 L450.0,148" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M450.0,210 L450.0,232" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M450.0,310 L450.0,332" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M450.0,380 L450.0,395.0 L250.0,395.0 L250.0,408" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M450.0,380 L450.0,395.0 L650.0,395.0 L650.0,408" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M250.0,518 L250.0,534.0 L450.0,534.0 L450.0,548" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M650.0,518 L650.0,534.0 L450.0,534.0 L450.0,548" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M450.0,590 L450.0,614" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M450.0,678 L450.0,698" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><rect x="24" y="754" width="14" height="12" rx="2" fill="#eef1f4" stroke="#6b7784"/><text x="44" y="764" class="k">data</text><rect x="80.4" y="754" width="14" height="12" rx="2" fill="#e3edf8" stroke="#3d6fa3"/><text x="100.4" y="764" class="k">preprocessing / features</text><rect x="268.79999999999995" y="754" width="14" height="12" rx="2" fill="#dff1ef" stroke="#0c6b6b"/><text x="288.79999999999995" y="764" class="k">trained</text><rect x="344.99999999999994" y="754" width="14" height="12" rx="2" fill="#f4f8f8" stroke="#0c6b6b" stroke-dasharray="6 4"/><text x="364.99999999999994" y="764" class="k">frozen, pretrained</text><rect x="493.79999999999995" y="754" width="14" height="12" rx="2" fill="#fbf0dc" stroke="#a8620f"/><text x="513.8" y="764" class="k">fusion / decision</text><rect x="636.0" y="754" width="14" height="12" rx="2" fill="#1b2430" stroke="#1b2430"/><text x="656.0" y="764" class="k">output</text></svg>