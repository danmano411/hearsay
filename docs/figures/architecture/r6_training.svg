<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 880" width="900" height="880" font-family="Segoe UI, Helvetica, Arial, sans-serif"><style>.t{font-size:20px;font-weight:700;fill:#1b2430}.s{font-size:13px;fill:#5d6975}.bt{font-size:14px;font-weight:600}.bl{font-size:12px}.al{font-size:11.5px;fill:#5d6975;font-style:italic}.k{font-size:11px;fill:#5d6975}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6975"/></marker></defs><rect width="900" height="880" fill="#ffffff"/><text x="24" y="34" class="t">R6 · same network as R4ft, how it is trained (and what R6 changed)</text><text x="24" y="56" class="s">The training loop both XLS-R models used. R6 = seed 1 + 6,155 more clips; checkpoint kept at step 4,096.</text><rect x="60" y="76" width="380" height="94" rx="8" fill="#eef1f4" stroke="#6b7784" stroke-width="1.6"/><text x="72" y="97" class="bt" fill="#1b2430">Training split (135k clips + R6&#x27;s 6,155)</text><text x="72" y="116" class="bl" fill="#3a4652">R6 adds: ASVspoof 2021 DF (2 samples),</text><text x="72" y="132" class="bl" fill="#3a4652">CD-ADD, DECRO-en</text><text x="72" y="148" class="bl" fill="#3a4652">never: DeepVoice, test sets</text><rect x="460" y="76" width="380" height="94" rx="8" fill="#e3edf8" stroke="#3d6fa3" stroke-width="1.6"/><text x="472" y="97" class="bt" fill="#1b2430">Balanced sampler</text><text x="472" y="116" class="bl" fill="#3a4652">groups = (source, label), drawn ∝ √size</text><text x="472" y="132" class="bl" fill="#3a4652">each batch: 4 real + 4 fake</text><text x="472" y="148" class="bl" fill="#3a4652">ASVspoof 5 reals × 2</text><rect x="230" y="200" width="440" height="62" rx="8" fill="#e3edf8" stroke="#3d6fa3" stroke-width="1.6"/><text x="242" y="221" class="bt" fill="#1b2430">augment() → prep() → random 4 s crop</text><text x="242" y="240" class="bl" fill="#3a4652">MP3 / noise / resample, same for both classes</text><rect x="230" y="292" width="440" height="62" rx="8" fill="#dff1ef" stroke="#0c6b6b" stroke-width="1.6"/><text x="242" y="313" class="bt" fill="#1b2430">XLS-R (12 blocks) + light back end</text><text x="242" y="332" class="bl" fill="#3a4652">exactly the R4ft architecture (see r4ft_xlsr.svg)</text><rect x="230" y="384" width="440" height="46" rx="8" fill="#dff1ef" stroke="#0c6b6b" stroke-width="1.6"/><text x="242" y="405" class="bt" fill="#1b2430">Binary cross-entropy on the logit</text><rect x="150" y="460" width="600" height="94" rx="8" fill="#dff1ef" stroke="#0c6b6b" stroke-width="1.6"/><text x="162" y="481" class="bt" fill="#1b2430">AdamW, 4 micro-batches accumulated = 32 clips per step</text><text x="162" y="500" class="bl" fill="#3a4652">learning rate 2e-5 at block 12, × 0.85 per block downward; back end 1e-3</text><text x="162" y="516" class="bl" fill="#3a4652">steps 0–300: only the back end learns · warm-up 500 · cosine decay</text><text x="162" y="532" class="bl" fill="#3a4652">bf16 mixed precision + gradient checkpointing: 4.9 GB on an 8 GB GPU</text><rect x="150" y="584" width="600" height="62" rx="8" fill="#fbf0dc" stroke="#a8620f" stroke-width="1.6"/><text x="162" y="605" class="bt" fill="#1b2430">Every 1,024 steps: score val_testlike (8,963 clips)</text><text x="162" y="624" class="bl" fill="#3a4652">keep best.pth if combined minDCF improves by ≥ 0.002; stop after 4 evals without</text><rect x="230" y="676" width="440" height="78" rx="8" fill="#1b2430" stroke="#1b2430" stroke-width="1.6"/><text x="242" y="697" class="bt" fill="#ffffff">R6 result: best checkpoint = step 4,096</text><text x="242" y="716" class="bl" fill="#dfe6ec">val 0.0267 (centre) / 0.0206 (win3) · R4ft: 0.0166 / 0.0121</text><text x="242" y="732" class="bl" fill="#dfe6ec">stopped at step ~7,150 (memory safeguard; recorded deviation)</text><path d="M250.0,170 L250.0,185.0 L340.0,185.0 L340.0,198" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M650.0,170 L650.0,185.0 L560.0,185.0 L560.0,198" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M450.0,262 L450.0,290" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M450.0,354 L450.0,382" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M450.0,430 L450.0,458" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M450.0,554 L450.0,582" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M450.0,646 L450.0,674" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#ah)"/><path d="M150,515 L110,515 L110,323 L228,323" fill="none" stroke="#5d6975" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah)"/><text x="40" y="420" class="al">update</text><text x="40" y="436" class="al">weights</text><rect x="24" y="854" width="14" height="12" rx="2" fill="#eef1f4" stroke="#6b7784"/><text x="44" y="864" class="k">data</text><rect x="80.4" y="854" width="14" height="12" rx="2" fill="#e3edf8" stroke="#3d6fa3"/><text x="100.4" y="864" class="k">preprocessing / features</text><rect x="268.79999999999995" y="854" width="14" height="12" rx="2" fill="#dff1ef" stroke="#0c6b6b"/><text x="288.79999999999995" y="864" class="k">trained</text><rect x="344.99999999999994" y="854" width="14" height="12" rx="2" fill="#f4f8f8" stroke="#0c6b6b" stroke-dasharray="6 4"/><text x="364.99999999999994" y="864" class="k">frozen, pretrained</text><rect x="493.79999999999995" y="854" width="14" height="12" rx="2" fill="#fbf0dc" stroke="#a8620f"/><text x="513.8" y="864" class="k">fusion / decision</text><rect x="636.0" y="854" width="14" height="12" rx="2" fill="#1b2430" stroke="#1b2430"/><text x="656.0" y="864" class="k">output</text></svg>