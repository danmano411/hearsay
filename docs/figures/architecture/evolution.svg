<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1272" width="900" height="1272" font-family="Segoe UI, Helvetica, Arial, sans-serif"><style>.t{font-size:20px;font-weight:700;fill:#1b2430}.s{font-size:13px;fill:#5d6975}.bt{font-size:14px;font-weight:600}.bl{font-size:12px}.al{font-size:11.5px;fill:#5d6975;font-style:italic}.k{font-size:11px;fill:#5d6975}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6975"/></marker></defs><rect width="900" height="1272" fill="#ffffff"/><text x="24" y="34" class="t">How the model evolved: from the problem to E7</text><text x="24" y="56" class="s">Each step: what we found, what we decided, and the number that showed it. Lower minDCF is better.</text><line x1="112" y1="120.0" x2="112" y2="1152.0" stroke="#c5ccd3" stroke-width="3"/><text x="98" y="116" text-anchor="end" class="bt" fill="#1b2430">Start</text><text x="98" y="133" text-anchor="end" class="k">25 Sep</text><circle cx="112" cy="120.0" r="6" fill="#6b7784"/><rect x="128" y="84" width="570" height="72" rx="8" fill="#eef1f4" stroke="#6b7784" stroke-width="1.6"/><text x="140" y="105" class="bt" fill="#1b2430">The problem</text><text x="140" y="124" class="bl" fill="#3a4652">69,450 fakes from 10 generators, but only 242 real clips, all of one speaker (LJSpeech).</text><text x="140" y="140" class="bl" fill="#3a4652">Score 1,671 unseen clips; ranked by the ASVspoof 5 minDCF (0 = perfect, 1 = useless).</text><rect x="710" y="84" width="170" height="72" rx="8" fill="#ffffff" stroke="#6b7784" stroke-width="1.6"/><text x="720" y="104" class="k">real clips in the given data</text><text x="720" y="126" style="font-size:15px;font-weight:700" fill="#1b2430">0.3 %</text><text x="720" y="144" class="k"></text><text x="98" y="202" text-anchor="end" class="bt" fill="#1b2430">Stage 1</text><text x="98" y="219" text-anchor="end" class="k">25 Sep</text><circle cx="112" cy="206.0" r="6" fill="#3d6fa3"/><rect x="128" y="170" width="570" height="72" rx="8" fill="#e3edf8" stroke="#3d6fa3" stroke-width="1.6"/><text x="140" y="191" class="bt" fill="#1b2430">Data audit → the prep() function</text><text x="140" y="210" class="bl" fill="#3a4652">A 3-level tree on trivial cues split real from fake perfectly: the 242 reals keep energy</text><text x="140" y="226" class="bl" fill="#3a4652">up to 8 kHz. Decision: prep() on every clip (DC, silence trim, 7 kHz low-pass, loudness).</text><rect x="710" y="170" width="170" height="72" rx="8" fill="#ffffff" stroke="#3d6fa3" stroke-width="1.6"/><text x="720" y="190" class="k">trivial-cue model (want ≈ 1)</text><text x="720" y="212" style="font-size:15px;font-weight:700" fill="#1b2430">0.391 → 0.853</text><text x="720" y="230" class="k">the shortcut is gone</text><text x="98" y="288" text-anchor="end" class="bt" fill="#1b2430">Stage 2</text><text x="98" y="305" text-anchor="end" class="k">25 Sep</text><circle cx="112" cy="292.0" r="6" fill="#6b7784"/><rect x="128" y="256" width="570" height="72" rx="8" fill="#eef1f4" stroke="#6b7784" stroke-width="1.6"/><text x="140" y="277" class="bt" fill="#1b2430">External data and grouped splits</text><text x="140" y="296" class="bl" fill="#3a4652">One real voice teaches &quot;this voice = real&quot;. Added 11 open corpora, including the exact</text><text x="140" y="312" class="bl" fill="#3a4652">speakers DiffSSD clones; 3 generators are never trained on, to test unseen ones.</text><rect x="710" y="256" width="170" height="72" rx="8" fill="#ffffff" stroke="#6b7784" stroke-width="1.6"/><text x="720" y="276" class="k">share of real clips</text><text x="720" y="298" style="font-size:15px;font-weight:700" fill="#1b2430">0.3 % → 31 %</text><text x="720" y="316" class="k">111k clips added</text><text x="98" y="374" text-anchor="end" class="bt" fill="#1b2430">Stage 3</text><text x="98" y="391" text-anchor="end" class="k">25–26 Sep</text><circle cx="112" cy="378.0" r="6" fill="#6b7784"/><rect x="128" y="342" width="570" height="72" rx="8" fill="#eef1f4" stroke="#6b7784" stroke-width="1.6"/><text x="140" y="363" class="bt" fill="#1b2430">Our own synthesis simulator</text><text x="140" y="382" class="bl" fill="#3a4652">5,204 fakes made from real clips (vocoder copy-synthesis) and open TTS models, so a fake</text><text x="140" y="398" class="bl" fill="#3a4652">can share the real clip&#x27;s voice and text. HiFi-GAN copies became the hardest fake type.</text><rect x="710" y="342" width="170" height="72" rx="8" fill="#ffffff" stroke="#6b7784" stroke-width="1.6"/><text x="720" y="362" class="k">simulated fakes</text><text x="720" y="384" style="font-size:15px;font-weight:700" fill="#1b2430">5,204</text><text x="720" y="402" class="k">7 generators</text><text x="98" y="460" text-anchor="end" class="bt" fill="#1b2430">Stage 4</text><text x="98" y="477" text-anchor="end" class="k">25 Sep</text><circle cx="112" cy="464.0" r="6" fill="#3d6fa3"/><rect x="128" y="428" width="570" height="72" rx="8" fill="#e3edf8" stroke="#3d6fa3" stroke-width="1.6"/><text x="140" y="449" class="bt" fill="#1b2430">Speech biology</text><text x="140" y="468" class="bl" fill="#3a4652">48 features of how speech is physically made: pitch jitter, shimmer, formant motion,</text><text x="140" y="484" class="bl" fill="#3a4652">breathing, turbulence. Weak alone, but they add to spectral features.</text><rect x="710" y="428" width="170" height="72" rx="8" fill="#ffffff" stroke="#3d6fa3" stroke-width="1.6"/><text x="720" y="448" class="k">held-out minDCF</text><text x="720" y="470" style="font-size:15px;font-weight:700" fill="#1b2430">0.438 / 0.201 / 0.169</text><text x="720" y="488" class="k">biology / spectral / both</text><text x="98" y="546" text-anchor="end" class="bt" fill="#1b2430">Stage 5</text><text x="98" y="563" text-anchor="end" class="k">25 Sep</text><circle cx="112" cy="550.0" r="6" fill="#3d6fa3"/><rect x="128" y="514" width="570" height="72" rx="8" fill="#e3edf8" stroke="#3d6fa3" stroke-width="1.6"/><text x="140" y="535" class="bt" fill="#1b2430">Read the scorer, not just the brief</text><text x="140" y="554" class="bl" fill="#3a4652">The brief and the organizers&#x27; code disagree on which error costs 4× and on direction.</text><text x="140" y="570" class="bl" fill="#3a4652">Decision: an exact local copy of the scorer, and both readings tracked everywhere.</text><rect x="710" y="514" width="170" height="72" rx="8" fill="#ffffff" stroke="#3d6fa3" stroke-width="1.6"/><text x="720" y="534" class="k">local scorer vs theirs</text><text x="720" y="556" style="font-size:15px;font-weight:700" fill="#1b2430">exact match</text><text x="720" y="574" class="k">unit-tested</text><text x="98" y="632" text-anchor="end" class="bt" fill="#1b2430">Stage 6</text><text x="98" y="649" text-anchor="end" class="k">25–26 Sep</text><circle cx="112" cy="636.0" r="6" fill="#0c6b6b"/><rect x="128" y="600" width="570" height="72" rx="8" fill="#dff1ef" stroke="#0c6b6b" stroke-width="1.6"/><text x="140" y="621" class="bt" fill="#1b2430">First model ladder: R0, R1, R3</text><text x="140" y="640" class="bl" fill="#3a4652">R1 (LightGBM on 228 spectral + biology features) is decent. The organizers&#x27; AASIST,</text><text x="140" y="656" class="bl" fill="#3a4652">pretrained elsewhere, fails on our data. Decision: fine-tune a big pretrained speech model.</text><rect x="710" y="600" width="170" height="72" rx="8" fill="#ffffff" stroke="#0c6b6b" stroke-width="1.6"/><text x="720" y="620" class="k">held-out minDCF</text><text x="720" y="642" style="font-size:15px;font-weight:700" fill="#1b2430">R1 0.169 · R3 0.867</text><text x="720" y="660" class="k"></text><text x="98" y="718" text-anchor="end" class="bt" fill="#1b2430">Stage 7</text><text x="98" y="735" text-anchor="end" class="k">26 Sep</text><circle cx="112" cy="722.0" r="6" fill="#0c6b6b"/><rect x="128" y="686" width="570" height="72" rx="8" fill="#dff1ef" stroke="#0c6b6b" stroke-width="1.6"/><text x="140" y="707" class="bt" fill="#1b2430">R4ft: fine-tuned XLS-R, then R5 fusion</text><text x="140" y="726" class="bl" fill="#3a4652">XLS-R-300M cut to 12 of 24 blocks to fit an 8 GB GPU, fine-tuned end to end. 9× better</text><text x="140" y="742" class="bl" fill="#3a4652">than R1. R5 adds R1 through a logistic-regression fusion: the initial submission.</text><rect x="710" y="686" width="170" height="72" rx="8" fill="#ffffff" stroke="#0c6b6b" stroke-width="1.6"/><text x="720" y="706" class="k">held-out minDCF</text><text x="720" y="728" style="font-size:15px;font-weight:700" fill="#1b2430">0.0192 → 0.0138</text><text x="720" y="746" class="k">R4ft → R5</text><text x="98" y="804" text-anchor="end" class="bt" fill="#1b2430">Stage 8</text><text x="98" y="821" text-anchor="end" class="k">26 Sep</text><circle cx="112" cy="808.0" r="6" fill="#c5ccd3"/><rect x="128" y="772" width="570" height="72" rx="8" fill="#ffffff" stroke="#c5ccd3" stroke-width="1.6" stroke-dasharray="3 3"/><text x="140" y="793" class="bt" fill="#1b2430">Generalization tests (inference only)</text><text x="140" y="812" class="bl" fill="#3a4652">Public benchmarks and typing-noise call audio. Strong on most; voice conversion</text><text x="140" y="828" class="bl" fill="#3a4652">(DeepVoice: celebrities from YouTube) is the weak spot. It becomes a guardrail.</text><rect x="710" y="772" width="170" height="72" rx="8" fill="#ffffff" stroke="#c5ccd3" stroke-width="1.6"/><text x="720" y="792" class="k">DeepVoice minDCF (R5)</text><text x="720" y="814" style="font-size:15px;font-weight:700" fill="#1b2430">0.150</text><text x="720" y="832" class="k"></text><text x="98" y="890" text-anchor="end" class="bt" fill="#1b2430">Stage 9</text><text x="98" y="907" text-anchor="end" class="k">26 Sep</text><circle cx="112" cy="894.0" r="6" fill="#c5ccd3"/><rect x="128" y="858" width="570" height="72" rx="8" fill="#ffffff" stroke="#c5ccd3" stroke-width="1.6" stroke-dasharray="3 3"/><text x="140" y="879" class="bt" fill="#1b2430">Official result: the test is harder</text><text x="140" y="898" class="bl" fill="#3a4652">The organizers scored R5 at 0.0584, about 4× our held-out number: new speakers, channels</text><text x="140" y="914" class="bl" fill="#3a4652">and generators. Decision: spend the remaining time on robustness and diversity.</text><rect x="710" y="858" width="170" height="72" rx="8" fill="#ffffff" stroke="#c5ccd3" stroke-width="1.6"/><text x="720" y="878" class="k">HGT official (R5)</text><text x="720" y="900" style="font-size:15px;font-weight:700" fill="#1b2430">0.0584</text><text x="720" y="918" class="k">EER 2.5 %</text><text x="98" y="976" text-anchor="end" class="bt" fill="#1b2430">Stage 10</text><text x="98" y="993" text-anchor="end" class="k">26 Sep</text><circle cx="112" cy="980.0" r="6" fill="#a8620f"/><rect x="128" y="944" width="570" height="72" rx="8" fill="#fbf0dc" stroke="#a8620f" stroke-width="1.6"/><text x="140" y="965" class="bt" fill="#1b2430">R6 and E5: a second opinion</text><text x="140" y="984" class="bl" fill="#3a4652">R4ft retrained with a new seed and 6,155 benchmark clips, so it makes different mistakes.</text><text x="140" y="1000" class="bl" fill="#3a4652">E5 = R4ft + R6 + R1, chosen by a rule written before R6 existed.</text><rect x="710" y="944" width="170" height="72" rx="8" fill="#ffffff" stroke="#a8620f" stroke-width="1.6"/><text x="720" y="964" class="k">E5 held-out · DeepVoice</text><text x="720" y="986" style="font-size:15px;font-weight:700" fill="#1b2430">0.0154 · 0.152</text><text x="720" y="1004" class="k"></text><text x="98" y="1062" text-anchor="end" class="bt" fill="#1b2430">Stage 11</text><text x="98" y="1079" text-anchor="end" class="k">27 Sep</text><circle cx="112" cy="1066.0" r="6" fill="#0c6b6b"/><rect x="128" y="1030" width="570" height="72" rx="8" fill="#dff1ef" stroke="#0c6b6b" stroke-width="1.6"/><text x="140" y="1051" class="bt" fill="#1b2430">R7a: RawBoost channel noise</text><text x="140" y="1070" class="bl" fill="#3a4652">60 % of training clips get simulated phone lines, cheap-mic distortion, clicks and noise,</text><text x="140" y="1086" class="bl" fill="#3a4652">so the model cannot lean on a clean recording. One model trained fully (14,336 steps).</text><rect x="710" y="1030" width="170" height="72" rx="8" fill="#ffffff" stroke="#0c6b6b" stroke-width="1.6"/><text x="720" y="1050" class="k">R7a held-out minDCF</text><text x="720" y="1072" style="font-size:15px;font-weight:700" fill="#1b2430">0.0149</text><text x="720" y="1090" class="k">best single model</text><text x="98" y="1148" text-anchor="end" class="bt" fill="#1b2430">Final</text><text x="98" y="1165" text-anchor="end" class="k">27 Sep</text><circle cx="112" cy="1152.0" r="6" fill="#1b2430"/><rect x="128" y="1116" width="570" height="72" rx="8" fill="#1b2430" stroke="#1b2430" stroke-width="1.6"/><text x="140" y="1137" class="bt" fill="#ffffff">E7: fusion of R4ft + R6 + R7a + R1</text><text x="140" y="1156" class="bl" fill="#dfe6ec">Four models that fail differently, weighted by a logistic regression fit on validation.</text><text x="140" y="1172" class="bl" fill="#dfe6ec">R7a gets the largest weight. Passes both guardrails; submitted as the final.</text><rect x="710" y="1116" width="170" height="72" rx="8" fill="#ffffff" stroke="#1b2430" stroke-width="1.6"/><text x="720" y="1136" class="k">E7 held-out · DeepVoice</text><text x="720" y="1158" style="font-size:15px;font-weight:700" fill="#1b2430">0.0132 · 0.133</text><text x="720" y="1176" class="k">best on both</text><text x="24" y="1228" class="al">Held-out minDCF: 9,747 clips never used to choose anything, organizers&#x27; settings. DeepVoice: a public benchmark never trained on.</text><rect x="24" y="1246" width="14" height="12" rx="2" fill="#eef1f4" stroke="#6b7784"/><text x="44" y="1256" class="k">data</text><rect x="80.4" y="1246" width="14" height="12" rx="2" fill="#e3edf8" stroke="#3d6fa3"/><text x="100.4" y="1256" class="k">preprocessing / features</text><rect x="268.79999999999995" y="1246" width="14" height="12" rx="2" fill="#dff1ef" stroke="#0c6b6b"/><text x="288.79999999999995" y="1256" class="k">trained</text><rect x="344.99999999999994" y="1246" width="14" height="12" rx="2" fill="#f4f8f8" stroke="#0c6b6b" stroke-dasharray="6 4"/><text x="364.99999999999994" y="1256" class="k">frozen, pretrained</text><rect x="493.79999999999995" y="1246" width="14" height="12" rx="2" fill="#fbf0dc" stroke="#a8620f"/><text x="513.8" y="1256" class="k">fusion / decision</text><rect x="636.0" y="1246" width="14" height="12" rx="2" fill="#1b2430" stroke="#1b2430"/><text x="656.0" y="1256" class="k">output</text></svg>